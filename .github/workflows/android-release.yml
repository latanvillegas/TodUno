name: Android quality and signed release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android platforms and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          for tool in aapt2 apksigner zipalign; do
            if [[ ! -x "$build_tools/$tool" ]]; then
              echo "::error::Missing Android SDK Build Tool: $build_tools/$tool"
              exit 1
            fi
          done
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run unit tests and lint without signing secrets
        run: |
          set -euo pipefail
          cp .env.example .env
          chmod +x ./gradlew
          python3 -m py_compile scripts/verify_release.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

  release:
    name: Sign and verify candidate or release APK + AAB
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: '0.0.1'
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate or release ref
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$EXPECTED_VERSION" ]] || {
              echo "::error::Tag must match v$EXPECTED_VERSION."
              exit 1
            }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tag must refer to a commit already present on main."
              exit 1
            }
          else
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "::error::Signed candidate requires manual dispatch on main."
              exit 1
            }
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android platforms and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          for tool in aapt2 apksigner zipalign; do
            if [[ ! -x "$build_tools/$tool" ]]; then
              echo "::error::Missing Android SDK Build Tool: $build_tools/$tool"
              exit 1
            fi
          done
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Require persistent production signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$EXPECTED_CERT" ]]; then
            echo "::error::Required release signing credentials are unavailable."
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-digit hexadecimal fingerprint."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toduno-release.jks"
          chmod 600 "$RUNNER_TEMP/toduno-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/toduno-release.jks" >> "$GITHUB_ENV"

      - name: Compile signed APK and Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp .env.example .env
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify package identity, version, signing certificate, and alignment
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --expected-package com.aistudio.selenialunar.kxmpzq \
            --expected-version "$EXPECTED_VERSION" \
            --min-version-code 20001 \
            --expected-cert "$EXPECTED_CERT"
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify -verbose "$aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-verification.txt" || {
            echo "::error::Android App Bundle signature verification failed."
            exit 1
          }
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TodUno-release.apk
          cp "$aab" dist/TodUno-release.aab
          cd dist
          sha256sum TodUno-release.apk TodUno-release.aab > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TodUno-signed-${{ github.event_name == 'workflow_dispatch' && 'candidate' || 'release' }}
          retention-days: 14
          path: |
            dist/TodUno-release.apk
            dist/TodUno-release.aab
            dist/SHA256SUMS
          if-no-files-found: error


  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail on newly introduced high-severity vulnerable dependencies
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high

  publish:
    name: Publish already verified release artifacts
    # The signing job can only READ repository contents; this job alone can WRITE releases.
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.0.1'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TodUno-signed-release
          path: dist

      - name: Check artifact integrity before publication
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test -s TodUno-release.apk
          test -s TodUno-release.aab

      - name: Publish immutable tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite its binaries."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/TodUno-release.apk \
            dist/TodUno-release.aab \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "TodUno $GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            --verify-tag
