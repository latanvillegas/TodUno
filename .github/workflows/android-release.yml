name: Compilar Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Compilar únicamente Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK (API 36.1)
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar plataforma Android 36.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar archivo .env y permisos de Gradle Wrapper
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Preparar Keystore de Firma Release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass selenia123 \
              -alias upload \
              -keypass selenia123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=TodUno,OU=Mobile,O=TodUno,L=Madrid,S=Madrid,C=ES"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=selenia123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=selenia123" >> "$GITHUB_ENV"
          fi

      - name: Compilar únicamente Release APK
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-configuration-cache --stacktrace

      - name: Recoger únicamente TodUno-release.apk
        run: |
          if [ -d "app/build/outputs/apk/debug" ] || compgen -G "app/build/outputs/apk/**/*debug*.apk" > /dev/null; then
            echo "Error: No debe compilarse ningún APK debug." >&2
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TodUno-release.apk
          ls -lh dist/TodUno-release.apk

      - name: Subir TodUno-release.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodUno-release-apk
          path: dist/TodUno-release.apk
          if-no-files-found: error
