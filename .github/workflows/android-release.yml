name: Android quality and signed release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint without signing secrets
        run: |
          set -euo pipefail
          cp .env.example .env
          chmod +x ./gradlew
          python3 -m py_compile scripts/verify_release.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

  release:
    name: Sign and publish verified APK + AAB
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must point to a commit already present on main."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require stable v2 production keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$EXPECTED_CERT" ]]; then
            echo "::error::Missing release signing secrets. Use tools/setup_signing_termux.sh to provision them."
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-digit hexadecimal fingerprint."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toduno-release.jks"
          chmod 600 "$RUNNER_TEMP/toduno-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/toduno-release.jks" >> "$GITHUB_ENV"

      - name: Compile signed APK and Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp .env.example .env
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify package identity, version, signing certificate, and alignment
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --expected-package com.aistudio.selenialunar.kxmpzq \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --min-version-code 20000 \
            --expected-cert "$EXPECTED_CERT"
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify -verbose "$aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-verification.txt" || {
            echo "::error::Android App Bundle signature verification failed."
            exit 1
          }
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TodUno-release.apk
          cp "$aab" dist/TodUno-release.aab
          cd dist
          sha256sum TodUno-release.apk TodUno-release.aab > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TodUno-signed-release
          path: |
            dist/TodUno-release.apk
            dist/TodUno-release.aab
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite its binaries."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/TodUno-release.apk \
            dist/TodUno-release.aab \
            dist/SHA256SUMS \
            --title "TodUno $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
