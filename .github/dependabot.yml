version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Keep version-update PRs disabled to maintain a single-branch repository.
    # Security alerts and dependency review remain available.
    open-pull-requests-limit: 0
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    # Keep version-update PRs disabled to maintain a single-branch repository.
    # Security alerts and dependency review remain available.
    open-pull-requests-limit: 0
